<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>启动中…</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; background: #0f1115; color: #e6e6e6; padding: 32px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
  }
  .spinner {
    width: 44px; height: 44px; border-radius: 50%;
    border: 4px solid #2a2f3a; border-top-color: #4f8cff;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .title { font-size: 18px; font-weight: 600; text-align: center; }
  .sub { font-size: 13px; color: #8b93a3; max-width: 480px; text-align: center; line-height: 1.6; min-height: 18px; }
  .checklist { list-style: none; padding: 0; margin: 2px 0; width: 480px; max-width: 92vw; }
  .checklist li { font-size: 13px; padding: 8px 12px; border-radius: 6px; margin-bottom: 6px;
                  background: #161b25; border: 1px solid #232b39; word-break: break-all; }
  .checklist li.ok { color: #7ee0a0; border-color: #234a35; }
  .checklist li.bad { color: #ffb86b; border-color: #5a3d1f; }
  .progress-wrap { width: 480px; max-width: 92vw; }
  .bar { width: 100%; height: 10px; background: #1c2230; border-radius: 6px; overflow: hidden; }
  .bar-fill { width: 0%; height: 100%; background: linear-gradient(90deg,#4f8cff,#7ee0a0); transition: width .2s; }
  .pct { font-size: 12px; color: #8b93a3; text-align: right; margin-top: 4px; }
  code { background: #1c2230; padding: 2px 6px; border-radius: 4px; color: #9ecbff; }
  #termWrap { width: 92vw; max-width: 880px; height: 80vh; flex-direction: column; display: none; }
  #status { background: #161b25; border: 1px solid #232b39; border-radius: 8px; padding: 10px 14px; margin-bottom: 8px; text-align: left; }
  #statusTitle { font-size: 14px; font-weight: 600; color: #e6e6e6; }
  #statusSub { font-size: 12px; color: #8b93a3; margin-top: 4px; line-height: 1.6; }
  #statusSub code { background: #1c2230; padding: 1px 5px; border-radius: 4px; color: #9ecbff; }
  #term { flex: 1; overflow: auto; background: #0b0e14; border: 1px solid #232b39; border-radius: 8px;
          padding: 12px; font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; color: #cfe3ff;
          text-align: left; white-space: pre-wrap; word-break: break-word; margin: 0; }
  #cmd { flex: 1; background: #11151d; border: 1px solid #2a3242; color: #e6e6e6; border-radius: 6px;
         padding: 8px 10px; font: 13px monospace; outline: none; }
  .prompt { color: #7ee0a0; font: 13px monospace; }
</style>
</head>
<body>
  <div class="spinner" id="spinner"></div>
  <div class="title" id="title">正在启动 DeepSeek dsh Web…</div>
  <ul class="checklist" id="checklist"></ul>
  <div class="progress-wrap" id="progressWrap" style="display:none">
    <div class="bar"><div class="bar-fill" id="bar"></div></div>
    <div class="pct" id="pct">0%</div>
  </div>
  <div class="sub" id="sub"></div>

  <div id="termWrap">
    <div id="promptBanner" style="display:none; background:#3a2a12; border:1px solid #6b4a1f; color:#ffcf8a; padding:8px 12px; border-radius:8px; font-size:13px; line-height:1.6; margin-bottom:8px; text-align:left; white-space:pre-wrap;"></div>
    <div id="status">
      <div id="statusTitle">正在准备…</div>
      <div id="statusSub"></div>
    </div>
    <pre id="term"></pre>
    <div style="display:flex; align-items:center; gap:8px; margin-top:8px;">
      <span class="prompt">$</span>
      <input id="cmd" placeholder="如需确认/输入，在此输入内容（例如 y）后按回车…" />
    </div>
  </div>

<script>/*__APP_JS__*/</script>
</body>
</html>
