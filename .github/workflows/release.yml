# 跨平台自动发版工作流
#
# 触发方式:
#   1. 手动触发（workflow_dispatch）- 在 Actions 页面手动运行，填写版本号
#   2. Tag 推送（push tags）- 推送 v* 格式的标签自动触发
#
# 产物（均上传到同一个 GitHub Release）：
#   - macOS  arm64 : dsh-desktop-macos-aarch64.dmg + .sig
#   - macOS  x86_64: dsh-desktop-macos-x86_64.dmg + .sig  （Intel Mac）
#   - Linux  x86_64: dsh-desktop-linux-x86_64.tar.gz + .sig
#   - Windows x86_64: dsh-desktop-windows-x86_64.zip + .sig
#   - checksums.txt（SHA-256）
#
# 命名约定：
#   - 应用名（包内）一律不加平台区分：macOS 内为 dsh-desktop.app，
#     Linux 内为 dsh-desktop 可执行文件，Windows 内为 dsh-desktop.exe。
#   - 压缩包（对外分发）加平台区分：.dmg / .tar.gz / .zip 文件名含
#     macos-aarch64 / macos-x86_64 / linux-x86_64 / windows-x86_64。
#
# 签名说明：
#   - 更新包使用 minisign (Ed25519) 签名
#   - 私钥存储在 GitHub Secrets: DSH_UPDATER_PRIVATE_KEY
#   - 私钥密码: DSH_UPDATER_PRIVATE_KEY_PASSWORD (可选)
#   - 客户端使用嵌入的公钥验证签名
name: Release

on:
  # 方式一：手动触发
  workflow_dispatch:
    inputs:
      version:
        description: "Release 版本号 / tag，例如 v0.2.0"
        required: true
        default: "v0.1.0"
  
  # 方式二：推送 v* 标签时自动触发
  push:
    tags:
      - 'v*'

# 允许工作流创建 Release 与 tag
permissions:
  contents: write

# 同一版本号只跑一个实例，避免重复发版
concurrency:
  group: release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  # --------------------------------------------------------------------------
  # macOS：在 Apple Silicon runner 上交叉编译 arm64 + x86_64，分别打包成两个 .dmg
  # --------------------------------------------------------------------------
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (with both macOS targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install rsign2 for signing
        run: cargo install rsign2

      - name: Build (arm64 + x86_64)
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin

      # 应用包名保持 dsh-desktop.app（不加平台区分）；仅 .dmg 压缩包加平台区分。
      # 统一走 package-dmg.sh 打包，保证 DMG 内包含 Applications 软链（拖拽安装）
      # 和 使用说明.txt；DSH_BIN 指定预编译二进制，DMG_OUT 指定输出文件名。
      # 两次打包依次进行，每次 build 后立即出 dmg，避免第二次 rm -rf dsh-desktop.app
      # 覆盖第一次的产物（dmg 已先行生成，不受影响）。
      - name: Package (two arch-specific .dmg; app name stays plain)
        run: |
          DSH_BIN=target/aarch64-apple-darwin/release/dsh-desktop \
          DMG_OUT=dsh-desktop-macos-aarch64.dmg \
            bash package-dmg.sh

          DSH_BIN=target/x86_64-apple-darwin/release/dsh-desktop \
          DMG_OUT=dsh-desktop-macos-x86_64.dmg \
            bash package-dmg.sh

      - name: Sign update packages
        # secrets 上下文不允许出现在 if 表达式中（GitHub 解析器限制），
        # 改为脚本内判断：未配置私钥时输出提示并跳过签名
        env:
          DSH_UPDATER_PRIVATE_KEY: ${{ secrets.DSH_UPDATER_PRIVATE_KEY }}
        run: |
          if [ -z "$DSH_UPDATER_PRIVATE_KEY" ]; then
            echo "DSH_UPDATER_PRIVATE_KEY is not set, skip signing"
            exit 0
          fi
          TEMP_KEY=$(mktemp)
          echo "$DSH_UPDATER_PRIVATE_KEY" > "$TEMP_KEY"
          
          # Sign both DMGs (rsign2: -W = passwordless secret key;
          # 签名产物为 .minisig，上传时重命名为 <asset>.sig)
          rsign sign dsh-desktop-macos-aarch64.dmg -s "$TEMP_KEY" -W \
            -x dsh-desktop-macos-aarch64.dmg.sig -t "dsh-desktop update package"
          rsign sign dsh-desktop-macos-x86_64.dmg -s "$TEMP_KEY" -W \
            -x dsh-desktop-macos-x86_64.dmg.sig -t "dsh-desktop update package"
          
          rm -f "$TEMP_KEY"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dsh-desktop-macos-aarch64.dmg
            dsh-desktop-macos-aarch64.dmg.sig
            dsh-desktop-macos-x86_64.dmg
            dsh-desktop-macos-x86_64.dmg.sig
          if-no-files-found: warn

  # --------------------------------------------------------------------------
  # Linux：x86_64，需系统 webkit2gtk-4.1（wry 0.49 默认依赖）
  # --------------------------------------------------------------------------
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install rsign2 for signing
        run: cargo install rsign2

      - name: Install system dependencies (webkit2gtk-4.1 / GTK3)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            build-essential curl wget libssl-dev librsvg2-dev

      - name: Build
        run: cargo build --release

      - name: Package (.tar.gz with binary + .desktop + icon)
        run: |
          mkdir -p dist
          cp target/release/dsh-desktop dist/
          cp resources/dsh-desktop.desktop dist/
          cp icon/logo-480.png dist/ 2>/dev/null || true
          tar -czvf dsh-desktop-linux-x86_64.tar.gz -C dist .

      - name: Sign update package
        env:
          DSH_UPDATER_PRIVATE_KEY: ${{ secrets.DSH_UPDATER_PRIVATE_KEY }}
        run: |
          if [ -z "$DSH_UPDATER_PRIVATE_KEY" ]; then
            echo "DSH_UPDATER_PRIVATE_KEY is not set, skip signing"
            exit 0
          fi
          TEMP_KEY=$(mktemp)
          echo "$DSH_UPDATER_PRIVATE_KEY" > "$TEMP_KEY"
          
          rsign sign dsh-desktop-linux-x86_64.tar.gz -s "$TEMP_KEY" -W \
            -x dsh-desktop-linux-x86_64.tar.gz.sig -t "dsh-desktop update package"
          
          rm -f "$TEMP_KEY"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dsh-desktop-linux-x86_64.tar.gz
            dsh-desktop-linux-x86_64.tar.gz.sig
          if-no-files-found: warn

  # --------------------------------------------------------------------------
  # Windows：x86_64，需 WebView2 运行时（Win11 自带；Win10 可能需安装）
  # --------------------------------------------------------------------------
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install rsign2 for signing
        run: cargo install rsign2

      - name: Build
        run: cargo build --release

      - name: Package (.zip with .exe)
        shell: pwsh
        run: |
          Compress-Archive -Path target/release/dsh-desktop.exe -DestinationPath dsh-desktop-windows-x86_64.zip

      - name: Sign update package
        env:
          DSH_UPDATER_PRIVATE_KEY: ${{ secrets.DSH_UPDATER_PRIVATE_KEY }}
        shell: bash
        run: |
          if [ -z "$DSH_UPDATER_PRIVATE_KEY" ]; then
            echo "DSH_UPDATER_PRIVATE_KEY is not set, skip signing"
            exit 0
          fi
          TEMP_KEY=$(mktemp)
          echo "$DSH_UPDATER_PRIVATE_KEY" > "$TEMP_KEY"
          
          rsign sign dsh-desktop-windows-x86_64.zip -s "$TEMP_KEY" -W \
            -x dsh-desktop-windows-x86_64.zip.sig -t "dsh-desktop update package"
          
          rm -f "$TEMP_KEY"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dsh-desktop-windows-x86_64.zip
            dsh-desktop-windows-x86_64.zip.sig
          if-no-files-found: warn

  # --------------------------------------------------------------------------
  # 汇总：把三个平台的制品收集起来，生成校验和，创建 GitHub Release
  # --------------------------------------------------------------------------
  release:
    needs: [macos, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble release files + checksums
        run: |
          mkdir -p out
          cp artifacts/macos/* out/ 2>/dev/null || true
          cp artifacts/linux/* out/ 2>/dev/null || true
          cp artifacts/windows/* out/ 2>/dev/null || true
          cd out
          sha256sum *.dmg *.tar.gz *.zip > checksums.txt 2>/dev/null || true
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: ${{ github.event.inputs.version || github.ref_name }}
          files: out/*
          generate_release_notes: true
          make_latest: true
          body: |
            ## dsh-desktop ${{ github.event.inputs.version || github.ref_name }}

            跨平台构建（带签名验证）。

            ### 下载与平台要求
            - **macOS (Apple Silicon)** — `dsh-desktop-macos-aarch64.dmg`
            - **macOS (Intel)** — `dsh-desktop-macos-x86_64.dmg`
              > 未签名构建可能被 Gatekeeper 拦截：首次打开请右键「打开」，或在终端执行 `xattr -cr /Applications/dsh-desktop.app` 后重试。
            - **Linux (x86_64)** — `dsh-desktop-linux-x86_64.tar.gz`
              > 解压后运行 `./dsh-desktop`。需系统已安装 `libwebkit2gtk-4.1`（及 GTK3），例如：
              > `sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev`
            - **Windows (x86_64)** — `dsh-desktop-windows-x86_64.zip`
              > 解压后运行 `dsh-desktop.exe`，需系统具备 WebView2 运行时（Windows 11 自带；Win10 可到微软官网安装）。

            ### 签名验证
            更新包使用 minisign (Ed25519) 签名，客户端会自动验证签名。

            ### 校验
            见 `checksums.txt`（SHA-256）。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# ============================================================================
